<svg id="svg-stack" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 711" role="img" aria-labelledby="title-stack desc-stack"><title id="title-stack">Building a transport twin</title><desc id="desc-stack">Road and travel observations feed shared geography, transport simulation, scenarios and interfaces. Housing or emissions models can be coupled to the transport model. New observations keep the application current.</desc><style>#svg-stack text{font-family:Arial,Helvetica,sans-serif;fill:#17333b;font-size:17px}#svg-stack .title{font-size:29px;font-weight:700}#svg-stack .small{font-size:14px;fill:#45616a}#svg-stack .label{font-size:18px;font-weight:700}#svg-stack .head{font-size:20px;font-weight:700}#svg-stack .cell{fill:#eef4f4}#svg-stack .band{fill:#ddeeea}#svg-stack .line{stroke:#8aa0a6;stroke-width:1.5;fill:none}#svg-stack .arrow{stroke:#327477;stroke-width:2;fill:none;marker-end:url(#arr-stack)}#svg-stack .dash{stroke-dasharray:6 5}#svg-stack .paper{fill:white}</style><defs><marker id="arr-stack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#327477"/></marker></defs><rect width="1080" height="711" class="paper"/><text x="30" y="43" class="title"><tspan x="30" dy="0">Building a transport twin</tspan></text><text x="30" y="76" class="small"><tspan x="30" dy="0">Example: compare a proposed cycle lane with the existing road layout</tspan></text><rect x="75" y="109" width="652" height="76" rx="8" class="cell"/><text x="97" y="140" class="head"><tspan x="97" dy="0">Real-world inputs</tspan></text><text x="97" y="166" class="small"><tspan x="97" dy="0">Roads · traffic counts · signals · transit · travel demand</tspan></text><path d="M 401 185 L 401 205" class="arrow"/><rect x="75" y="208" width="652" height="76" rx="8" class="cell"/><text x="97" y="239" class="head"><tspan x="97" dy="0">Shared geographic data</tspan></text><text x="97" y="265" class="small"><tspan x="97" dy="0">Align roads, junctions, stops, parcels and neighborhoods</tspan></text><path d="M 401 284 L 401 304" class="arrow"/><rect x="75" y="307" width="652" height="76" rx="8" class="cell"/><text x="97" y="338" class="head"><tspan x="97" dy="0">Transport simulation</tspan></text><text x="97" y="364" class="small"><tspan x="97" dy="0">Aimsun · MATSim · SUMO</tspan></text><path d="M 401 383 L 401 403" class="arrow"/><rect x="75" y="406" width="652" height="76" rx="8" class="cell"/><text x="97" y="437" class="head"><tspan x="97" dy="0">Scenario runs and results</tspan></text><text x="97" y="463" class="small"><tspan x="97" dy="0">Change the layout; estimate routes, congestion and travel times</tspan></text><path d="M 401 482 L 401 502" class="arrow"/><rect x="75" y="505" width="652" height="76" rx="8" class="band"/><text x="97" y="536" class="head"><tspan x="97" dy="0">Professional and public interfaces</tspan></text><text x="97" y="562" class="small"><tspan x="97" dy="0">Compare alternatives on a map; inspect results; share proposals</tspan></text><rect x="790" y="283" width="257" height="165" rx="8" class="band"/><text x="810" y="315" class="head"><tspan x="810" dy="0">Connected models</tspan></text><text x="810" y="350" class=""><tspan x="810" dy="0">Housing and land use</tspan><tspan x="810" dy="30">Emissions</tspan><tspan x="810" dy="30">Other local outcomes</tspan></text><path d="M 727 338 L 787 338" class="arrow"/><path d="M 790 400 L 730 400" class="arrow"/><text x="791" y="479" class="small"><tspan x="791" dy="0">Exchange demand, accessibility</tspan><tspan x="791" dy="22">or other modeled quantities.</tspan></text><path d="M 75 542 L 43 542 L 43 147 L 71 147" class="arrow dash"/><text x="75" y="651" class="small"><tspan x="75" dy="0">Keep the twin current as roads, travel patterns and observations change.</tspan><tspan x="75" dy="24">The team operating the application maintains its data connections and models.</tspan></text></svg>