<svg id="svg-engine" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1040" role="img" aria-labelledby="title-engine desc-engine"><title id="title-engine">Inside an engine</title><desc id="desc-engine">Five layers of a simulation engine for a place: inputs (map layers, networks, populations, observations); the state and the clock; six kinds of process that change the state (physical solvers, cellular automata, network flow, agent-based, stocks and flows, discrete events), any of which a learned model can stand in for; what is wrapped around a run (coupling, data assimilation, calibration, scenarios, search); and outputs (maps, indicators, an interface).</desc><style>#svg-engine text{font-family:Arial,Helvetica,sans-serif;fill:#17333b;font-size:17px}#svg-engine .title{font-size:29px;font-weight:700}#svg-engine .small{font-size:14px;fill:#45616a}#svg-engine .label{font-size:17px;font-weight:700}#svg-engine .head{font-size:20px;font-weight:700}#svg-engine .cell{fill:#eef4f4}#svg-engine .band{fill:#ddeeea}#svg-engine .line{stroke:#8aa0a6;stroke-width:1.5;fill:none}#svg-engine .arrow{stroke:#327477;stroke-width:2;fill:none;marker-end:url(#arr-engine)}#svg-engine .dash{stroke-dasharray:6 5}#svg-engine .paper{fill:white}</style><defs><marker id="arr-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#327477"/></marker></defs><rect width="1080" height="1040" class="paper"/><text x="30" y="43" class="title">Inside an engine</text><text x="30" y="76" class="small">The parts a simulation of a place is usually assembled from</text><rect x="20" y="100" width="1040" height="138" rx="10" class="band"/><text x="36" y="130" class="head">1. What goes in</text><rect x="36" y="144" width="245" height="82" rx="8" class="cell"/><text x="50" y="172" class="label">Map layers</text><text x="50" y="196" class="small">terrain, land cover,</text><text x="50" y="216" class="small">buildings, parcels</text><rect x="290" y="144" width="245" height="82" rx="8" class="cell"/><text x="304" y="172" class="label">Networks</text><text x="304" y="196" class="small">roads, rivers, pipes,</text><text x="304" y="216" class="small">power lines</text><rect x="544" y="144" width="245" height="82" rx="8" class="cell"/><text x="558" y="172" class="label">Populations</text><text x="558" y="196" class="small">people, households,</text><text x="558" y="216" class="small">firms, animals</text><rect x="798" y="144" width="245" height="82" rx="8" class="cell"/><text x="812" y="172" class="label">Observations</text><text x="812" y="196" class="small">gauges, sensors,</text><text x="812" y="216" class="small">satellites, counts</text><rect x="20" y="268" width="1040" height="96" rx="10" class="band"/><text x="36" y="298" class="head">2. The state and the clock</text><rect x="36" y="308" width="620" height="46" rx="8" class="cell"/><text x="50" y="336" class="label">The state: everything the model holds about the place at one moment</text><rect x="668" y="308" width="376" height="46" rx="8" class="cell"/><text x="682" y="336" class="label">The clock: steps, or the next event</text><path d="M 540 238 L 540 266" class="arrow"/><rect x="20" y="394" width="1040" height="300" rx="10" class="band"/><text x="36" y="424" class="head">3. Processes that change the state, one step at a time</text><rect x="36" y="438" width="330" height="102" rx="8" class="cell"/><text x="50" y="466" class="label">Physical solvers</text><text x="50" y="490" class="small">equations of water, air, heat</text><text x="50" y="510" class="small">or fire on a grid or mesh</text><rect x="375" y="438" width="330" height="102" rx="8" class="cell"/><text x="389" y="466" class="label">Cellular automata</text><text x="389" y="490" class="small">each grid cell changes by a</text><text x="389" y="510" class="small">rule about its neighbours</text><rect x="714" y="438" width="330" height="102" rx="8" class="cell"/><text x="728" y="466" class="label">Network flow</text><text x="728" y="490" class="small">traffic, water or power</text><text x="728" y="510" class="small">through links and nodes</text><rect x="36" y="550" width="330" height="102" rx="8" class="cell"/><text x="50" y="578" class="label">Agent-based</text><text x="50" y="602" class="small">individuals that each decide</text><text x="50" y="622" class="small">and act: rules, choice models,</text><text x="50" y="642" class="small">learned policies, language models</text><rect x="375" y="550" width="330" height="102" rx="8" class="cell"/><text x="389" y="578" class="label">Stocks and flows</text><text x="389" y="602" class="small">totals that fill and drain,</text><text x="389" y="622" class="small">with feedback, over years</text><rect x="714" y="550" width="330" height="102" rx="8" class="cell"/><text x="728" y="578" class="label">Discrete events</text><text x="728" y="602" class="small">queues, schedules and</text><text x="728" y="622" class="small">things that happen in turn</text><text x="36" y="678" class="small">A learned model, trained on data or on another model's runs, can stand in for any of these.</text><path d="M 300 364 L 300 392" class="arrow"/><path d="M 780 392 L 780 364" class="arrow"/><rect x="20" y="724" width="1040" height="150" rx="10" class="band"/><text x="36" y="754" class="head">4. What is wrapped around a run</text><rect x="36" y="768" width="195" height="92" rx="8" class="cell"/><text x="50" y="796" class="label">Coupling</text><text x="50" y="820" class="small">passes state between</text><text x="50" y="840" class="small">two models</text><rect x="239" y="768" width="195" height="92" rx="8" class="cell"/><text x="253" y="796" class="label">Data assimilation</text><text x="253" y="820" class="small">corrects the state</text><text x="253" y="840" class="small">with observations</text><rect x="442" y="768" width="195" height="92" rx="8" class="cell"/><text x="456" y="796" class="label">Calibration</text><text x="456" y="820" class="small">tunes parameters</text><text x="456" y="840" class="small">against the record</text><rect x="645" y="768" width="195" height="92" rx="8" class="cell"/><text x="659" y="796" class="label">Scenarios</text><text x="659" y="820" class="small">many runs across</text><text x="659" y="840" class="small">what is uncertain</text><rect x="848" y="768" width="195" height="92" rx="8" class="cell"/><text x="862" y="796" class="label">Search</text><text x="862" y="820" class="small">optimisation and</text><text x="862" y="840" class="small">reinforcement learning</text><path d="M 540 694 L 540 722" class="arrow"/><rect x="20" y="904" width="1040" height="112" rx="10" class="band"/><text x="36" y="934" class="head">5. What comes out</text><rect x="36" y="944" width="330" height="62" rx="8" class="cell"/><text x="50" y="972" class="label">Maps and animations</text><text x="50" y="996" class="small">the state over time</text><rect x="375" y="944" width="330" height="62" rx="8" class="cell"/><text x="389" y="972" class="label">Indicators</text><text x="389" y="996" class="small">numbers to compare runs by</text><rect x="714" y="944" width="330" height="62" rx="8" class="cell"/><text x="728" y="972" class="label">An interface</text><text x="728" y="996" class="small">for specialists or the public</text><path d="M 540 874 L 540 902" class="arrow"/></svg>